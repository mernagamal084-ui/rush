<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RUSH — Ride Your Own Chaos</title>

<style>
:root{--y:#FFD60A;--b:#1F4FFF;--r:#E8262B;--p:#FF3D9A;--k:#0B0B0B;--w:#FFF6E3;--bg:var(--w);--fg:var(--k);--card:#fff;--ln:3px solid #0B0B0B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--p);outline-offset:3px}
.panel{background:var(--card);color:var(--fg);border:var(--ln);box-shadow:9px 9px 0 #000;border-radius:6px;position:relative}
.ph{border:var(--ln);width:100%;background:#000}

.dc{position:absolute;pointer-events:none;z-index:1}

.filters .in{width:auto;min-width:200px}.chip{font:400 22px Bangers;border:var(--ln);background:var(--card);color:var(--fg);border-radius:30px;padding:2px 16px;cursor:pointer}.chip[aria-pressed=true]{background:var(--b);color:#fff;box-shadow:3px 3px 0 #000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:56px 40px}

footer{background:#000;color:var(--y);padding:44px 6vw calc(30px + env(safe-area-inset-bottom,0px));font-size:15px}footer a{margin-right:16px}footer p{color:#ddd;margin-top:10px;max-width:60em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--y);color:#000;border:var(--ln);box-shadow:5px 5px 0 #000;font:400 26px Bangers;padding:6px 22px;border-radius:12px;animation:tp .3s}

#ov{position:fixed;inset:0;z-index:100;display:none;place-items:center;overflow:hidden}#ov>div{width:230vmax;height:230vmax;background:#000;position:relative}#ov>div>div{position:absolute;inset:1.2vmax;background:var(--y)}
@media(prefers-reduced-motion:no-preference){.tk{animation:mq 30s linear infinite}.fl{animation:fl 4s ease-in-out infinite alternate}.pulse{display:block;animation:pu 1s ease-in-out infinite alternate}}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes fl{to{transform:translateY(-14px) rotate(10deg)}}@keyframes pu{to{transform:translateX(14px)}}
@media(max-width:820px){
.pd,.two{grid-template-columns:1fr}.sum{position:static}.line{grid-template-columns:80px 1fr}.line .ph{width:80px}.line>:last-child{grid-column:1/-1}.sec{padding:50px 5vw}}

.card:hover .cut.on{transform:translateY(-6px) rotate(-1.5deg) scale(1.04);transition:transform .25s}
.spin{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}.spin:active{cursor:grabbing}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:22px;color:#000;opacity:.7}
.line .tilt,.line .cw{width:110px}

.bz{position:absolute;width:15%;top:-4%;right:0;opacity:0}.bz.b2{left:2%;right:auto;top:26%;width:10%;transform:scaleX(-1)}

.burger i:nth-child(1){top:12px}.burger i:nth-child(2){top:19px}.burger i:nth-child(3){top:26px}.burger[aria-expanded=true] i:nth-child(1){top:19px;transform:rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){opacity:0}.burger[aria-expanded=true] i:nth-child(3){top:19px;transform:rotate(-45deg)}

@media(max-width:900px){.burger{display:block}.hd nav{position:fixed;inset:0;left:0;transform:none;flex-direction:column;justify-content:center;gap:4px;padding:90px 8vw 40px;background:radial-gradient(rgba(0,0,0,.25) 22%,transparent 24%) 0 0/14px 14px,var(--b);visibility:hidden;clip-path:circle(0 at 90% 4%);transition:clip-path .45s cubic-bezier(.7,0,.2,1),visibility 0s .45s;z-index:-1}

.ctas{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.btn.xl{font-size:32px}

.s-road{background:#0B0B0B}.world{position:absolute;inset:0;transform-origin:50% 35.6%}

{id:'ghost-flash',n:'GHOST FLASH',num:'03',cat:'Street-Sport',tag:'The silent one',img:'white',col:'#FFD60A',price:1350000,stock:'in',

function boom(el){if(RM||!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#FFD60A','#FF3D9A','#1F4FFF','#E8262B'];
 for(let i=0;i<10;i++){const s=document.createElement('b');s.textContent=i%3?'★':'⚡';Object.assign(s.style,{position:'fixed',left:cx+'px',top:cy+'px',zIndex:120,pointerEvents:'none',fontSize:(16+Math.random()*20)+'px',color:cols[i%4],webkitTextStroke:'1px #000'});document.body.appendChild(s);

/* ---------- STORE (cart + compare, persisted in localStorage) ---------- */

 return html`<${Ctx.Provider} value=${api}>${children}<//>`}

/* ---------- SMALL PARTS ---------- */
const A=({to,cls,burst,children,...r})=>html`<a href=${'#'+to} class=${cls} onClick=${e=>{e.preventDefault();go(to)}} onMouseEnter=${e=>burst&&boom(e.currentTarget)} ...${r}>${children}</a>`;
const Arrow=({c='#FFD60A',s=360,flip,rot=0})=>html`<span class="pulse" style=${{transform:'rotate('+rot+'deg) scaleX('+(flip?-1:1)+')'}}><svg class="ar" width=${s} viewBox="0 0 400 240" aria-hidden="true" style=${{display:'block',maxWidth:'100%',overflow:'visible'}}>
 <path d="M16 214C70 80 210 24 318 104" fill="none" stroke="#FF3D9A" stroke-width="22" stroke-linecap="round" transform="translate(-10 14)"/><path d="M16 214C70 80 210 24 318 104" fill="none" stroke="#1F4FFF" stroke-width="12" stroke-linecap="round" transform="translate(6 32)"/>
 <path d="M16 214C70 80 210 24 318 104" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round"/><path d="M16 214C70 80 210 24 318 104" fill="none" stroke=${c} stroke-width="30" stroke-linecap="round"/>

/* ---------- BIKE VISUALS ----------

function Spin({p}){const [f,setF]=useState(2),[auto,setAuto]=useState(!RM),d=useRef(null),go1=n=>{setAuto(false);setF(((n%6)+6)%6)};

const Stock=({p})=>html`<span class="stk" style=${{background:STK[p.stock][1]}}>${STK[p.stock][0]}</span>`;

/* ---------- HOME: a scroll journey of four connected scenes ----------

 const mv=e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty('--mx',(e.clientX-r.left)+'px');e.currentTarget.style.setProperty('--my',(e.clientY-r.top)+'px')};
 return html`<section class="sec"><div class="wrap pd">
 <div data-rv="l"><div class="panel spot" style=${{'--c':p.col}} onPointerMove=${mv}><span class="bn d" aria-hidden="true">${p.num}</span>${p.cut?html`<${Spin} p=${p}/>`:html`<${Photo} p=${p} eager=${1}/>`}</div>
  <div class="pager"><${A} to=${'p-'+pv.id} cls="btn s">← ${pv.n}<//><${A} to="garage" cls="btn s p">ALL BIKES<//><${A} to=${'p-'+nx.id} cls="btn s">${nx.n} →<//></div></div>
 <div data-rv="r"><p class="d" style=${{fontSize:26,color:'var(--b)'}}>${p.cat} · ${p.tag}</p><h1 class="d nm">${p.n}</h1>
  <div class="row"><span class="d price" style=${{fontSize:46}}>${fmt(p.price)}</span><${Stock} p=${p}/></div><p style=${{margin:'12px 0'}}>${p.desc}</p>
  <fieldset><legend>Colorway</legend>${p.colors.map((c,k)=>html`<label class=${'pill'+(k===ci?' on':'')} key=${c}><input type="radio" name="col" checked=${k===ci} onChange=${()=>setCi(k)}/>${c}</label>`)}<small style=${{display:'block'}}>The photo shows the first colorway. Others are placeholders.</small></fieldset>
  <div class="row"><div class="qty"><button aria-label="Decrease quantity" onClick=${()=>setQ(Math.max(1,q-1))}>−</button><output aria-live="polite">${q}</output><button aria-label="Increase quantity" onClick=${()=>setQ(Math.min(9,q+1))}>+</button></div>
   <button class="btn b" onClick=${e=>{boom(e.currentTarget);add(p.id,p.colors[ci],q)}}>${p.stock==='pre'?'PRE-ORDER':'ADD TO CART'} — ${fmt(p.price*q)}</button></div>
  <label class="cmp" style=${{marginTop:12}}><input type="checkbox" checked=${cmp.includes(p.id)} onChange=${()=>toggleCmp(p.id)}/>Add to compare</label>
  <div class="panel paper"><h3 class="d" style=${{fontSize:34}}>Tech specs</h3><div class="note">PLACEHOLDER DATA — edit in PRODUCTS.</div><table><tbody>${ROWS.map(r=>html`<tr key=${r[0]}><th scope="row">${r[0]}</th><td>${r[1](p)}</td></tr>`)}</tbody></table></div></div></div></section>`}

/* ---------- COMPARE ---------- */
function Compare(){const {cmp,toggleCmp}=useContext(Ctx),sel=cmp.map(byId).filter(Boolean);
 const rows=[['Price',p=>fmt(p.price),p=>p.price,-1],...ROWS];
 return html`<section class="sec"><div class="wrap"><h1 class="d" data-rv="l">Compare <span style=${{color:'var(--p)'}}>bikes</span></h1><p>Pick up to three. Highlighted cells win that row.</p>
 <div class="filters">${PRODUCTS.map(p=>html`<button class="chip" key=${p.id} aria-pressed=${cmp.includes(p.id)} onClick=${()=>toggleCmp(p.id)}>${p.n}</button>`)}</div>
 ${sel.length<2?html`<div class="panel" style=${{padding:30}}><h2 class="d">Choose at least two bikes ↑</h2></div>`:html`<div class="panel tw"><table><thead><tr><th scope="col"></th>${sel.map(p=>html`<th scope="col" key=${p.id}><${A} to=${'p-'+p.id}><span class="d" style=${{fontSize:26}}>${p.n}</span><//></th>`)}</tr></thead>
 <tbody>${rows.map(r=>{const v=r[2]&&sel.map(r[2]),best=v&&r[3]*1>0?Math.max(...v):v?Math.min(...v):null;return html`<tr key=${r[0]}><th scope="row">${r[0]}</th>${sel.map((p,k)=>html`<td key=${p.id} class=${v&&v[k]===best&&new Set(v).size>1?'best':''}>${r[1](p)}</td>`)}</tr>`})}</tbody></table></div><div class="note">Specs are placeholders.</div>`}</div></section>`}

/* ---------- CART + CHECKOUT ---------- */
function Cart(){const {lines,setQty,remove,sub,vat,total}=useContext(Ctx);
 if(!lines.length)return html`<section class="sec"><div class="wrap"><h1 class="d">Cart is empty</h1><p style=${{margin:'12px 0 24px'}}>Your garage has room. Fill it.</p><${A} to="garage" cls="btn b" burst=${1}>GO TO THE GARAGE →<//></div></section>`;
 return html`<section class="sec"><div class="wrap"><h1 class="d" data-rv="l">Your <span style=${{color:'var(--p)'}}>cart</span></h1><div class="two" style=${{marginTop:30}}><div>
 ${lines.map(l=>html`<div class="panel line" key=${l.id+l.c}><${Photo} p=${l.p}/><div><div class="d" style=${{fontSize:32}}>${l.p.n}</div><small>${l.c}</small><div>${fmt(l.p.price)} each</div></div>
  <div class="row" style=${{justifyContent:'flex-end'}}><div class="qty"><button aria-label=${'Decrease '+l.p.n} onClick=${()=>setQty(l.id,l.c,l.q-1)}>−</button><output>${l.q}</output><button aria-label=${'Increase '+l.p.n} onClick=${()=>setQty(l.id,l.c,l.q+1)}>+</button></div><b>${fmt(l.p.price*l.q)}</b><button class="btn s p" onClick=${()=>remove(l.id,l.c)} aria-label=${'Remove '+l.p.n}>✕</button></div></div>`)}</div>
 <aside class="panel sum"><h3 class="d" style=${{fontSize:36}}>Summary</h3><p><span>Subtotal</span><b>${fmt(sub)}</b></p><p><span>Est. VAT (${CFG.vat*100}%)</span><b>${fmt(vat)}</b></p><p><span>Delivery</span><b>Quoted later</b></p><hr/><p style=${{fontSize:22}}><span>Total</span><b>${fmt(total)}</b></p>
 <div class="note">Tax and delivery are placeholders; confirm real rules before selling.</div><${A} to="checkout" cls="btn b" burst=${1} style=${{width:'100%',textAlign:'center'}}>CHECKOUT →<//></aside></div></div></section>`}
function Checkout(){const {lines,sub,vat,total}=useContext(Ctx),[f,setF]=useState({name:'',email:'',phone:'',address:'',city:'',pay:'cash'}),[er,setEr]=useState({}),[done,setDone]=useState(false);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const sub1=e=>{e.preventDefault();const x={};if(f.name.trim().length<2)x.name='Enter your full name';if(!/^\S+@\S+\.\S+$/.test(f.email))x.email='Enter a valid email';if(f.phone.replace(/\D/g,'').length<7)x.phone='Enter a valid phone number';if(f.address.trim().length<5)x.address='Enter your address';if(!f.city.trim())x.city='Enter your city';setEr(x);if(!Object.keys(x).length)setDone(true)};
 const F=(k,l,t='text')=>html`<label class="f" for=${'f'+k}>${l}</label><input class="in" id=${'f'+k} type=${t} value=${f[k]} onInput=${set(k)} aria-invalid=${!!er[k]}/>${er[k]&&html`<div class="err">${er[k]}</div>`}`;
 if(!lines.length)return html`<section class="sec"><h1 class="d">Nothing to check out</h1><${A} to="garage" cls="btn">Garage<//></section>`;
 if(done)return html`<section class="sec"><div class="wrap panel" style=${{padding:30}}><h1 class="d" style=${{color:'var(--r)'}}>Order NOT placed</h1><p style=${{margin:'12px 0'}}>This demo store is not connected to a payment gateway or order system, so nothing was charged or submitted. Your details were validated in the browser only. Your cart is kept.</p><p><b>Still needed:</b> payment provider, orders database/API, inventory, confirmation emails (see the Dev notes).</p><div class="row"><${A} to="cart" cls="btn s">BACK TO CART<//><${A} to="dev" cls="btn s b">DEV NOTES<//></div></div></section>`;
 return html`<section class="sec"><div class="wrap"><h1 class="d">Checkout</h1><div class="two"><form class="panel" style=${{padding:24}} onSubmit=${sub1} noValidate>${F('name','Full name')}${F('email','Email','email')}${F('phone','Phone','tel')}${F('address','Address')}${F('city','City')}
 <label class="f" for="fpay">Payment method</label><select class="in" id="fpay" value=${f.pay} onChange=${set('pay')}><option value="cash">Pay at showroom (placeholder)</option><option value="bank">Bank transfer (placeholder)</option><option value="card">Card — gateway not connected</option></select>
 <div class="note">Submitting will NOT create a real order — backend not connected.</div><button class="btn b" type="submit">PLACE ORDER →</button></form>
 <aside class="panel sum"><h3 class="d" style=${{fontSize:34}}>Order summary</h3>${lines.map(l=>html`<p key=${l.id+l.c}><span>${l.q}× ${l.p.n}</span><b>${fmt(l.p.price*l.q)}</b></p>`)}<hr/><p><span>Subtotal</span><b>${fmt(sub)}</b></p><p><span>Est. VAT</span><b>${fmt(vat)}</b></p><p style=${{fontSize:22}}><span>Total</span><b>${fmt(total)}</b></p></aside></div></div></section>`}

/* ---------- ABOUT / CONTACT / DEV ---------- */
function About(){const P=[['Once upon a boring road…','A grey commute. A grey helmet. A very grey sandwich.','#fff'],['KA-POW!','Something loud turned the corner. It was yellow, blue and entirely unreasonable.','var(--y)'],['The Garage opens','Five bikes. Five personalities. Not one beige option.','var(--p)'],['Ride your own chaos.','That is the whole idea. The rest is just horsepower.','var(--b)']];
 return html`<section class="sec"><div class="wrap"><h1 class="d" data-rv="l">About <span style=${{color:'var(--p)'}}>RUSH</span></h1><p style=${{maxWidth:'40em',margin:'14px 0 40px'}}>RUSH is a motorcycle store that lives inside a comic book. Brand story below is placeholder copy — replace it with your own.</p>
 <div class="strip">${P.map((x,i)=>html`<div class="panel" data-rv=${i%2?'r':'l'} key=${i} style=${{background:x[2],color:i>2?'#fff':'#000'}}><div class="d" style=${{fontSize:44}}>${x[0]}</div><p>${x[1]}</p></div>`)}</div></div></section>`}
function Contact(){const [f,setF]=useState({name:'',email:'',bike:'General',msg:''}),[e,setE]=useState('');const set=k=>x=>setF({...f,[k]:x.target.value});
 const send=x=>{x.preventDefault();if(!f.name.trim()||!/^\S+@\S+\.\S+$/.test(f.email)||f.msg.trim().length<5){setE('Please add your name, a valid email and a message.');return}setE('');location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent('RUSH inquiry: '+f.bike)+'&body='+encodeURIComponent(f.msg+'\n\n— '+f.name+' ('+f.email+')')};
 return html`<section class="sec"><div class="wrap two"><div data-rv="l"><h1 class="d">Contact</h1><p style=${{margin:'14px 0'}}>Purchase questions, test rides, trade-ins.</p><div class="panel paper"><p><b>Email</b> ${CFG.email}</p><p><b>Phone</b> ${CFG.phone}</p><p><b>Showroom</b> ${CFG.addr}</p><small>Placeholder details — edit CFG.</small></div></div>
 <form class="panel" style=${{padding:24}} onSubmit=${send} noValidate data-rv="r"><label class="f" for="cn">Name</label><input class="in" id="cn" value=${f.name} onInput=${set('name')}/><label class="f" for="ce">Email</label><input class="in" id="ce" type="email" value=${f.email} onInput=${set('email')}/>
 <label class="f" for="cb">Bike</label><select class="in" id="cb" value=${f.bike} onChange=${set('bike')}><option>General</option>${PRODUCTS.map(p=>html`<option key=${p.id}>${p.n}</option>`)}</select><label class="f" for="cm">Message</label><textarea class="in" id="cm" rows="5" value=${f.msg} onInput=${set('msg')}></textarea>
 ${e&&html`<div class="err">${e}</div>`}<div class="note">Opens your email app (no server form handler yet).</div><button class="btn b" type="submit">SEND INQUIRY →</button></form></div></section>`}
function Dev(){return html`<section class="sec"><div class="wrap"><h1 class="d">Dev notes</h1><div class="panel paper"><h3 class="d" style=${{fontSize:32}}>Edit later</h3><p>PRODUCTS (names, prices in EGP, specs, colours, stock) and CFG (currency, VAT, contact) at the top of the script.</p>
 <h3 class="d" style=${{fontSize:32,marginTop:16}}>Works now (frontend only)</h3><p>Browse, search, filter, sort, product pages, compare (max 3), cart (persists in this browser), quantities, totals, checkout form validation.</p>
 <h3 class="d" style=${{fontSize:32,marginTop:16}}>Needs backend</h3><ul style=${{paddingLeft:22}}><li>Payment gateway (e.g. Paymob/Stripe) with server-side verification</li><li>Orders API + database; real order confirmations</li><li>Inventory and stock status sync; product admin/CMS</li><li>Taxes, delivery and registration fees (VAT 14% is a placeholder)</li><li>Email/CRM delivery for inquiries (contact form uses mailto)</li><li>User accounts, order history, legal pages</li><li>Real specs, prices and model names to replace placeholders</li><li>Only CRIMSON KAPOW has the multi-angle transparent set (rotation, hero ride). Supply 6-angle sets for the other four to give them the same treatment; until then they keep their photos with tilt, wipe-in and lean motion</li></ul></div></div></section>`}

/* ---------- SHELL ---------- */
function useRoute(){const [h,setH]=useState(location.hash.slice(1)||'home');useEffect(()=>{const f=()=>setH(location.hash.slice(1)||'home');addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return h}
const LK=[['home','Home'],['garage','Garage'],['about','About'],['contact','Contact']];
const TT={home:'RUSH — Ride Your Own Chaos',garage:'The Rush Garage — RUSH',compare:'Compare — RUSH',cart:'Cart — RUSH',checkout:'Checkout — RUSH',about:'About — RUSH',contact:'Contact — RUSH',dev:'Dev notes — RUSH'};
function Shell(){const h=useRoute(),{count,cmp,toast}=useContext(Ctx),[open,setOpen]=useState(false),[sm,setSm]=useState(false),nv=useRef(),hd=useRef(),first=useRef(1);
 useEffect(()=>{setOpen(false);const p=h.startsWith('p-')?byId(h.slice(2)):0;document.title=p?p.n+' — RUSH':(TT[h]||TT.home);if(first.current){first.current=0;return}const m=document.getElementById('main');m&&m.focus({preventScroll:true})},[h]);
 useEffect(()=>{const f=()=>{setSm(scrollY>40);const p=document.getElementById('prog');p&&(p.style.transform='scaleX('+(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+')')};f();addEventListener('scroll',f,{passive:true});return()=>removeEventListener('scroll',f)},[]);
 useEffect(()=>{document.body.style.overflow=open?'hidden':'';if(!open)return;const a=nv.current&&nv.current.querySelector('a');a&&a.focus();
  const k=e=>{if(e.key==='Escape')setOpen(false);if(e.key==='Tab'){const l=[...hd.current.querySelectorAll('a,button')],f=l[0],z=l[l.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();f.focus()}}};
  addEventListener('keydown',k);return()=>{removeEventListener('keydown',k);document.body.style.overflow=''}},[open]);
 const V=h==='home'?Home:h==='garage'?Garage:h==='compare'?Compare:h==='cart'?Cart:h==='checkout'?Checkout:h==='about'?About:h==='contact'?Contact:h==='dev'?Dev:h.startsWith('p-')?Product:Home;
 const cur=t=>h===t||(t==='garage'&&h.startsWith('p-'))?'page':null;
 return html`<a class="skip" href="#main" onClick=${e=>{e.preventDefault();document.getElementById('main').focus()}}>Skip to content</a><div id="prog" class="prog" aria-hidden="true"></div>
  <header class=${'hd'+(sm?' sm':'')} ref=${hd}><${A} to="home" cls="logo d" aria-label="RUSH — home">RUSH<svg class="lg-bolt" viewBox="0 0 100 100" aria-hidden="true"><polygon points="58,0 14,56 44,56 30,100 86,38 54,38" fill="#FFD60A" stroke="#000" stroke-width="8" stroke-linejoin="round"/></svg><//>
   <nav id="site-nav" ref=${nv} class=${open?'open':''} aria-label="Main">${LK.map(([t,l],i)=>html`<${A} to=${t} key=${t} aria-current=${cur(t)}><small>0${i+1}</small>${l}<//>`)}<${A} to="compare" cls="nx" aria-current=${cur('compare')}>Compare${cmp.length?' ('+cmp.length+')':''}<//><p class="nx d">Ride your own chaos.</p></nav>
   <${A} to="cart" cls="cartb" aria-label=${'Cart, '+count+(count===1?' item':' items')}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.6 12.2a2 2 0 002 1.6h7.7a2 2 0 002-1.5L21 7H6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.6" fill="#fff"/><circle cx="18" cy="21" r="1.6" fill="#fff"/></svg><span class="cc" key=${count}>${count}</span><//>
   <button class="burger" aria-label=${open?'Close menu':'Open menu'} aria-expanded=${open} aria-controls="site-nav" onClick=${()=>setOpen(!open)}><i></i><i></i><i></i></button></header>
  <${Page} key=${h}><${V} id=${h.slice(2)}/><//>
  <footer><div class="d" style=${{fontSize:50}}>RUSH — Ride your own chaos.</div><div class="fl">${LK.map(([t,l])=>html`<${A} to=${t} key=${t}>${l}<//>`)}<${A} to="compare">Compare<//><${A} to="cart">Cart<//><${A} to="dev">Dev notes<//></div><p>Demo store: all prices, specs and contact details are placeholders. No real orders or payments are processed.</p></footer>
  ${toast&&html`<div class="toast" role="status">${toast}</div>`}<div id="ov" aria-hidden="true"><div style=${{clipPath:SP}}><div style=${{clipPath:SP}}></div></div><div class="rays"></div></div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Store}><${Shell}/><//>`);
</script></body></html>
